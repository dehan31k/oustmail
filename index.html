<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oustra Mail - Kalıcı Webmail</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 350px; text-align: center; }
    h2 { color: #1a73e8; margin-bottom: 20px; }
    .input-group { display: flex; align-items: center; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 15px; overflow: hidden; background: #fafafa; }
    input { border: none; outline: none; padding: 12px; width: 100%; font-size: 14px; background: transparent; }
    .domain { padding: 0 12px; color: #555; font-weight: bold; background: #eee; line-height: 42px; }
    button { background: #1a73e8; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #1557b0; }
    #status { margin-top: 15px; font-size: 14px; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Oustra Mail</h2>
    <p style="font-size: 13px; color: #666; margin-bottom: 20px;">Sonsuza dek kalıcı @oustra.com hesabını oluştur.</p>
    
    <div class="input-group">
      <input type="text" id="username" placeholder="kullaniciadi">
      <span class="domain">@oustra.com</span>
    </div>
    
    <input type="password" id="password" placeholder="Şifreniz" style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 15px; box-sizing: border-box; outline: none;">
    
    <button onclick="createAccount()">Hesap Oluştur</button>
    <p id="status"></p>
  </div>

  <script>
    async function createAccount() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const status = document.getElementById('status');

      if (!username || !password) {
        status.style.color = "red";
        status.innerText = "Lütfen tüm alanları doldurun!";
        return;
      }

      status.style.color = "#333";
      status.innerText = "Hesap oluşturuluyor...";

      try {
        const response = await fetch('/.netlify/functions/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const result = await response.json();

        if (response.ok) {
          status.style.color = "green";
          status.innerText = "✅ " + result.message;
        } else {
          status.style.color = "red";
          status.innerText = "❌ " + (result.error || "Bir hata oluştu.");
        }
      } catch (err) {
        status.style.color = "red";
        status.innerText = "❌ Sunucu bağlantı hatası!";
      }
    }
  </script>
</body>
</html>
